<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">What changes on the way to production</title><desc id="desc">Keep the controlled workflow. Add operating controls and complexity when measured needs justify them.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">What changes on the way to production</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">Keep the controlled workflow. Add operating controls and complexity when measured needs justify them.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">EVOLUTION</tspan></text><polyline points="505,275 580,275" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1020,275 1095,275" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="285,350 285,465" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="800,350 800,465" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1315,350 1315,465" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="demo" data-x="65" data-y="200" data-w="440" data-h="150"><rect x="65" y="200" width="440" height="150" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="65" y="217" width="4" height="116" rx="2" fill="#7256b0"/><text x="83" y="235" fill="#7256b0" font-size="20" font-weight="600"><tspan x="83" dy="0">01 / Defensible local demo</tspan></text><text x="83" y="264" fill="#525b6e" font-size="17" font-weight="400"><tspan x="83" dy="0">One user; two fictional products</tspan><tspan x="83" dy="22.950000000000003">Live research and explicit captured replay</tspan><tspan x="83" dy="22.950000000000003">LLM rubric, code gates, human decisions</tspan><tspan x="83" dy="22.950000000000003">Optional bounded buyer comparison</tspan></text></g><g data-node="pilot" data-x="580" data-y="200" data-w="440" data-h="150"><rect x="580" y="200" width="440" height="150" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="580" y="217" width="4" height="116" rx="2" fill="#426eb0"/><text x="598" y="235" fill="#426eb0" font-size="20" font-weight="600"><tspan x="598" dy="0">02 / Controlled AWS pilot</tspan></text><text x="598" y="264" fill="#525b6e" font-size="17" font-weight="400"><tspan x="598" dy="0">Small named Sales cohort</tspan><tspan x="598" dy="22.950000000000003">SSO, queues, managed state and audit</tspan><tspan x="598" dy="22.950000000000003">Approved search and model contracts</tspan><tspan x="598" dy="22.950000000000003">Versioned evidence and buyer decisions</tspan></text></g><g data-node="scale" data-x="1095" data-y="200" data-w="440" data-h="150"><rect x="1095" y="200" width="440" height="150" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="1095" y="217" width="4" height="116" rx="2" fill="#327b67"/><text x="1113" y="235" fill="#327b67" font-size="20" font-weight="600"><tspan x="1113" dy="0">03 / Wider operation</tspan></text><text x="1113" y="264" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1113" dy="0">Useful leads and adoption demonstrated</tspan><tspan x="1113" dy="22.950000000000003">Freshness and CRM reconciliation</tspan><tspan x="1113" dy="22.950000000000003">Capacity, on-call and restore drills</tspan><tspan x="1113" dy="22.950000000000003">Monitored evidence and buyer quality</tspan></text></g><g data-node="proof1" data-x="65" data-y="465" data-w="440" data-h="210"><rect x="65" y="465" width="440" height="210" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="65" y="482" width="4" height="176" rx="2" fill="#616777"/><text x="83" y="500" fill="#616777" font-size="20" font-weight="600"><tspan x="83" dy="0">Evidence to leave this stage</tspan></text><text x="83" y="529" fill="#525b6e" font-size="17" font-weight="400"><tspan x="83" dy="0">Verify citation and workflow safeguards</tspan><tspan x="83" dy="22.950000000000003">Expert-label fit and buying responsibilities</tspan><tspan x="83" dy="22.950000000000003">Test German / English equivalence</tspan><tspan x="83" dy="22.950000000000003">Establish manual research baseline</tspan><tspan x="83" dy="22.950000000000003">Record unknowns and technical constraints</tspan></text></g><g data-node="proof2" data-x="580" data-y="465" data-w="440" data-h="210"><rect x="580" y="465" width="440" height="210" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="580" y="482" width="4" height="176" rx="2" fill="#616777"/><text x="598" y="500" fill="#616777" font-size="20" font-weight="600"><tspan x="598" dy="0">Evidence to leave this stage</tspan></text><text x="598" y="529" fill="#525b6e" font-size="17" font-weight="400"><tspan x="598" dy="0">Useful accepted leads per Sales hour</tspan><tspan x="598" dy="22.950000000000003">Unsupported buyer claims and missed buyers</tspan><tspan x="598" dy="22.950000000000003">Ranking quality and correction rates</tspan><tspan x="598" dy="22.950000000000003">Successful restore and retry exercises</tspan><tspan x="598" dy="22.950000000000003">SAP sandbox duplicates handled</tspan></text></g><g data-node="proof3" data-x="1095" data-y="465" data-w="440" data-h="210"><rect x="1095" y="465" width="440" height="210" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="1095" y="482" width="4" height="176" rx="2" fill="#616777"/><text x="1113" y="500" fill="#616777" font-size="20" font-weight="600"><tspan x="1113" dy="0">Add complexity conditionally</tspan></text><text x="1113" y="529" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1113" dy="0">Hybrid retrieval: demonstrated retrieval gap</tspan><tspan x="1113" dy="22.950000000000003">More workers: measured queue pressure</tspan><tspan x="1113" dy="22.950000000000003">Multi-agent roles: proven quality benefit</tspan><tspan x="1113" dy="22.950000000000003">Multi-region: agreed RTO / RPO</tspan><tspan x="1113" dy="22.950000000000003">Kubernetes: existing platform requirement</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">A separate LLM call or a conditional graph branch does not by itself make this an autonomous multi-agent system.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">These are proposed acceptance gates. Test counts and a successful live run do not establish commercial quality or ROI.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">TECHNOVA CASE STUDY / FICTIONAL SOFTWARE PRODUCTS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>