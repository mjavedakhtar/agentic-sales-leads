<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">A restrained AWS production architecture</title><desc id="desc">ECS Fargate preserves the Python application. Managed state and durable jobs replace local executors.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">A restrained AWS production architecture</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">ECS Fargate preserves the Python application. Managed state and durable jobs replace local executors.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">PROPOSED AWS</tspan></text><rect x="355" y="175" width="735" height="615" rx="18" fill="#f3f2f7" stroke="#d7d4e3" stroke-dasharray="7 5"/><text x="375" y="203" fill="#7d788e" font-size="15" font-weight="600"><tspan x="375" dy="0">AWS ACCOUNT: PROPOSED EU REGION</tspan></text><rect x="1155" y="175" width="410" height="615" rx="18" fill="#f3f2f7" stroke="#d7d4e3" stroke-dasharray="7 5"/><text x="1175" y="203" fill="#7d788e" font-size="15" font-weight="600"><tspan x="1175" dy="0">EXTERNAL / APPROVED ENDPOINTS</tspan></text><polyline points="300,270 390,270" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="532,327 532,400" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="532,525 532,650" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="545" y="572" width="201" height="25" rx="4" fill="#faf9fc"/><text x="550" y="590" fill="#72798d" font-size="17" font-weight="400"><tspan x="550" dy="0">Commit job / decision</tspan></text><polyline points="912,327 912,400" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="923" y="357" width="75" height="25" rx="4" fill="#faf9fc"/><text x="928" y="375" fill="#72798d" font-size="17" font-weight="400"><tspan x="928" dy="0">Receive</tspan></text><polyline points="675,705 720,705 720,270 770,270" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="715" y="347" width="66" height="25" rx="4" fill="#faf9fc"/><text x="720" y="365" fill="#72798d" font-size="17" font-weight="400"><tspan x="720" dy="0">Outbox</tspan></text><polyline points="820,525 820,615 645,615 645,650" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="970,525 970,650" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1055,425 1125,425 1125,270 1190,270" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1055,470 1190,470" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1055,510 1100,510 1100,705 1190,705" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="user" data-x="50" data-y="215" data-w="250" data-h="112"><rect x="50" y="215" width="250" height="112" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="50" y="232" width="4" height="78" rx="2" fill="#966419"/><text x="68" y="250" fill="#966419" font-size="20" font-weight="600"><tspan x="68" dy="0">Sales browser</tspan></text><text x="68" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="68" dy="0">Corporate user / HTTPS</tspan></text></g><g data-node="alb" data-x="390" data-y="215" data-w="285" data-h="112"><rect x="390" y="215" width="285" height="112" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="390" y="232" width="4" height="78" rx="2" fill="#426eb0"/><text x="408" y="250" fill="#426eb0" font-size="20" font-weight="600"><tspan x="408" dy="0">Internal ALB + OIDC</tspan></text><text x="408" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="408" dy="0">Corporate network access</tspan><tspan x="408" dy="22.950000000000003">Approved identity provider</tspan></text></g><g data-node="api" data-x="390" data-y="400" data-w="285" data-h="125"><rect x="390" y="400" width="285" height="125" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="390" y="417" width="4" height="91" rx="2" fill="#426eb0"/><text x="408" y="435" fill="#426eb0" font-size="20" font-weight="600"><tspan x="408" dy="0">ECS Fargate API / UI</tspan></text><text x="408" y="464" fill="#525b6e" font-size="17" font-weight="400"><tspan x="408" dy="0">Private subnets across two AZs</tspan><tspan x="408" dy="22.950000000000003">Authorization; job submission</tspan><tspan x="408" dy="22.950000000000003">Human decisions; read APIs</tspan></text></g><g data-node="queue" data-x="770" data-y="215" data-w="285" data-h="112"><rect x="770" y="215" width="285" height="112" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="770" y="232" width="4" height="78" rx="2" fill="#426eb0"/><text x="788" y="250" fill="#426eb0" font-size="20" font-weight="600"><tspan x="788" dy="0">SQS queues + DLQ</tspan></text><text x="788" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="788" dy="0">Research, buyer, review and CRM</tspan><tspan x="788" dy="22.950000000000003">Dispatcher reads DB outbox</tspan></text></g><g data-node="worker" data-x="770" data-y="400" data-w="285" data-h="125"><rect x="770" y="400" width="285" height="125" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="770" y="417" width="4" height="91" rx="2" fill="#426eb0"/><text x="788" y="435" fill="#426eb0" font-size="20" font-weight="600"><tspan x="788" dy="0">ECS Fargate workers</tspan></text><text x="788" y="464" fill="#525b6e" font-size="17" font-weight="400"><tspan x="788" dy="0">Leases + LangGraph adapter</tspan><tspan x="788" dy="22.950000000000003">Budgeted versioned workflows</tspan><tspan x="788" dy="22.950000000000003">Independent scaling</tspan></text></g><g data-node="rds" data-x="390" data-y="650" data-w="285" data-h="112"><rect x="390" y="650" width="285" height="112" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="390" y="667" width="4" height="78" rx="2" fill="#327b67"/><text x="408" y="685" fill="#327b67" font-size="20" font-weight="600"><tspan x="408" dy="0">RDS PostgreSQL</tspan></text><text x="408" y="714" fill="#525b6e" font-size="17" font-weight="400"><tspan x="408" dy="0">Business / jobs / audit / outbox</tspan><tspan x="408" dy="22.950000000000003">Checkpoints / Multi-AZ</tspan></text></g><g data-node="s3" data-x="770" data-y="650" data-w="285" data-h="112"><rect x="770" y="650" width="285" height="112" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="770" y="667" width="4" height="78" rx="2" fill="#327b67"/><text x="788" y="685" fill="#327b67" font-size="20" font-weight="600"><tspan x="788" dy="0">S3 evidence + products</tspan></text><text x="788" y="714" fill="#525b6e" font-size="17" font-weight="400"><tspan x="788" dy="0">Versioned, permitted objects</tspan><tspan x="788" dy="22.950000000000003">BM25 runs in the worker</tspan></text></g><g data-node="search" data-x="1190" data-y="215" data-w="345" data-h="112"><rect x="1190" y="215" width="345" height="112" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="1190" y="232" width="4" height="78" rx="2" fill="#a4486a"/><text x="1208" y="250" fill="#a4486a" font-size="20" font-weight="600"><tspan x="1208" dy="0">Approved search / data API</tspan></text><text x="1208" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1208" dy="0">Discovery and content-use rights</tspan><tspan x="1208" dy="22.950000000000003">Controlled outbound access</tspan></text></g><g data-node="model" data-x="1190" data-y="400" data-w="345" data-h="125"><rect x="1190" y="400" width="345" height="125" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="1190" y="417" width="4" height="91" rx="2" fill="#a4486a"/><text x="1208" y="435" fill="#a4486a" font-size="20" font-weight="600"><tspan x="1208" dy="0">Approved model endpoint</tspan></text><text x="1208" y="464" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1208" dy="0">Gemini remains external to AWS</tspan><tspan x="1208" dy="22.950000000000003">Bedrock requires a separate adapter</tspan><tspan x="1208" dy="22.950000000000003">Evaluate model and prompt changes</tspan></text></g><g data-node="sap" data-x="1190" data-y="650" data-w="345" data-h="112"><rect x="1190" y="650" width="345" height="112" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="1190" y="667" width="4" height="78" rx="2" fill="#a4486a"/><text x="1208" y="685" fill="#a4486a" font-size="20" font-weight="600"><tspan x="1208" dy="0">SAP C4C</tspan></text><text x="1208" y="714" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1208" dy="0">Connector consumes CRM outbox</tspan><tspan x="1208" dy="22.950000000000003">Edition, API and mapping to confirm</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Across services: scoped IAM roles, Secrets Manager, KMS, controlled egress, CloudWatch / OpenTelemetry and CI/CD.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Private subnets do not make external Gemini or search traffic private. Provider, region and data-use choices need approval.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">CHEMNOVUS CASE STUDY / FICTIONAL MATERIALS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>