<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The workflow after production hardening</title><desc id="desc">Persist work before dispatch; release resources during human waits; apply the same explicit qualification rules.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">The workflow after production hardening</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">Persist work before dispatch; release resources during human waits; apply the same explicit qualification rules.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">PROPOSED AWS</tspan></text><polyline points="390,277 440,277" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,277 820,277" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1150,277 1200,277" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1245,345 1245,390 985,390 985,425" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1000" y="359" width="84" height="25" rx="4" fill="#faf9fc"/><text x="1005" y="377" fill="#72798d" font-size="17" font-weight="400"><tspan x="1005" dy="0">Optional</tspan></text><polyline points="985,545 985,635" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1355,345 1355,585 1100,585 1100,635" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1110" y="554" width="183" height="25" rx="4" fill="#faf9fc"/><text x="1115" y="572" fill="#72798d" font-size="17" font-weight="400"><tspan x="1115" dy="0">Without buyer check</tspan></text><polyline points="820,695 770,695" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="440,695 390,695" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1490,345 1548,345 1548,580 1420,580 1420,635" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1200,695 1150,695" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="identity" data-x="60" data-y="210" data-w="330" data-h="135"><rect x="60" y="210" width="330" height="135" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="60" y="227" width="4" height="101" rx="2" fill="#966419"/><text x="78" y="245" fill="#966419" font-size="20" font-weight="600"><tspan x="78" dy="0">Approve research scope</tspan></text><text x="78" y="274" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Identity and product permissions</tspan><tspan x="78" dy="22.950000000000003">Human confirms interpreted scope</tspan><tspan x="78" dy="22.950000000000003">Fixed graph stages and clear gates</tspan></text></g><g data-node="job" data-x="440" data-y="210" data-w="330" data-h="135"><rect x="440" y="210" width="330" height="135" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="440" y="227" width="4" height="101" rx="2" fill="#327b67"/><text x="458" y="245" fill="#327b67" font-size="20" font-weight="600"><tspan x="458" dy="0">Persist job + outbox</tspan></text><text x="458" y="274" fill="#525b6e" font-size="17" font-weight="400"><tspan x="458" dy="0">Database commit before enqueue</tspan><tspan x="458" dy="22.950000000000003">Queue carries job and version IDs</tspan><tspan x="458" dy="22.950000000000003">Leases and idempotency on execution</tspan></text></g><g data-node="worker" data-x="820" data-y="210" data-w="330" data-h="135"><rect x="820" y="210" width="330" height="135" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="820" y="227" width="4" height="101" rx="2" fill="#426eb0"/><text x="838" y="245" fill="#426eb0" font-size="20" font-weight="600"><tspan x="838" dy="0">Execute research stages</tspan></text><text x="838" y="274" fill="#525b6e" font-size="17" font-weight="400"><tspan x="838" dy="0">Retrieve / search / extract / assess</tspan><tspan x="838" dy="22.950000000000003">Code calculates scores and gates</tspan><tspan x="838" dy="22.950000000000003">Budgeted retries; durable checkpoints</tspan></text></g><g data-node="ready" data-x="1200" data-y="210" data-w="330" data-h="135"><rect x="1200" y="210" width="330" height="135" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="1200" y="227" width="4" height="101" rx="2" fill="#327b67"/><text x="1218" y="245" fill="#327b67" font-size="20" font-weight="600"><tspan x="1218" dy="0">Persist the shortlist</tspan></text><text x="1218" y="274" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1218" dy="0">Evidence, model and policy versions</tspan><tspan x="1218" dy="22.950000000000003">Release task and queue message</tspan><tspan x="1218" dy="22.950000000000003">Preserve original assessment</tspan></text></g><g data-node="buyer_job" data-x="820" data-y="425" data-w="330" data-h="120"><rect x="820" y="425" width="330" height="120" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="820" y="442" width="4" height="86" rx="2" fill="#426eb0"/><text x="838" y="460" fill="#426eb0" font-size="20" font-weight="600"><tspan x="838" dy="0">Optional buyer-check job</tspan></text><text x="838" y="489" fill="#525b6e" font-size="17" font-weight="400"><tspan x="838" dy="0">Same evidence before new research</tspan><tspan x="838" dy="22.950000000000003">Bounded search and role qualification</tspan><tspan x="838" dy="22.950000000000003">Separate versioned comparison</tspan></text></g><g data-node="crm" data-x="60" data-y="635" data-w="330" data-h="120"><rect x="60" y="635" width="330" height="120" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="60" y="652" width="4" height="86" rx="2" fill="#a4486a"/><text x="78" y="670" fill="#a4486a" font-size="20" font-weight="600"><tspan x="78" dy="0">Deliver to SAP C4C</tspan></text><text x="78" y="699" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Connector with idempotency key</tspan><tspan x="78" dy="22.950000000000003">Reconcile ambiguous responses</tspan><tspan x="78" dy="22.950000000000003">Approved, mapped records only</tspan></text></g><g data-node="decision" data-x="440" data-y="635" data-w="330" data-h="120"><rect x="440" y="635" width="330" height="120" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="440" y="652" width="4" height="86" rx="2" fill="#327b67"/><text x="458" y="670" fill="#327b67" font-size="20" font-weight="600"><tspan x="458" dy="0">Decision + CRM outbox</tspan></text><text x="458" y="699" fill="#525b6e" font-size="17" font-weight="400"><tspan x="458" dy="0">Atomic business transaction</tspan><tspan x="458" dy="22.950000000000003">Backend gate and version check</tspan><tspan x="458" dy="22.950000000000003">Auditable reviewer identity</tspan></text></g><g data-node="human" data-x="820" data-y="635" data-w="330" data-h="120"><rect x="820" y="635" width="330" height="120" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="820" y="652" width="4" height="86" rx="2" fill="#966419"/><text x="838" y="670" fill="#966419" font-size="20" font-weight="600"><tspan x="838" dy="0">Reviewer returns later</tspan></text><text x="838" y="699" fill="#525b6e" font-size="17" font-weight="400"><tspan x="838" dy="0">Fresh authorization and rationale</tspan><tspan x="838" dy="22.950000000000003">Separate resumable review job</tspan><tspan x="838" dy="22.950000000000003">No waiting worker task</tspan></text></g><g data-node="refresh" data-x="1200" data-y="635" data-w="330" data-h="120"><rect x="1200" y="635" width="330" height="120" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="1200" y="652" width="4" height="86" rx="2" fill="#426eb0"/><text x="1218" y="670" fill="#426eb0" font-size="20" font-weight="600"><tspan x="1218" dy="0">Schedule evidence refresh</tspan></text><text x="1218" y="699" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1218" dy="0">Create a new evidence version</tspan><tspan x="1218" dy="22.950000000000003">Do not silently rewrite old decisions</tspan><tspan x="1218" dy="22.950000000000003">Re-review significant changes</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">At-least-once queue delivery requires leases, stale-version checks and idempotent side effects; exhausted jobs enter a DLQ.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Multiple autonomous agents are a later option only if measured quality improves enough to justify added cost and complexity.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">TECHNOVA CASE STUDY / FICTIONAL SOFTWARE PRODUCTS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>