<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">From source capture to a scored hypothesis</title><desc id="desc">Extraction, semantic assessment and score calculation have different responsibilities.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">From source capture to a scored hypothesis</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">Extraction, semantic assessment and score calculation have different responsibilities.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">IMPLEMENTED</tspan></text><polyline points="450,275 565,275" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="450,545 500,545 500,315 565,315" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="980,275 1095,275" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1315,360 1315,410 770,410 770,480" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="300,345 300,390 620,390 620,480" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="310" y="359" width="165" height="25" rx="4" fill="#faf9fc"/><text x="315" y="377" fill="#72798d" font-size="17" font-weight="400"><tspan x="315" dy="0">Retrieved context</tspan></text><polyline points="980,565 1095,565" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1315,645 1315,705" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="product" data-x="60" data-y="205" data-w="390" data-h="140"><rect x="60" y="205" width="390" height="140" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="60" y="222" width="4" height="106" rx="2" fill="#327b67"/><text x="78" y="240" fill="#327b67" font-size="20" font-weight="600"><tspan x="78" dy="0">Product evidence</tspan></text><text x="78" y="269" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Selected fictional material; BM25</tspan><tspan x="78" dy="22.950000000000003">Page-cited, product-filtered PDF chunks</tspan><tspan x="78" dy="22.950000000000003">No embeddings or external vector store</tspan></text></g><g data-node="public" data-x="60" data-y="480" data-w="390" data-h="155"><rect x="60" y="480" width="390" height="155" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="60" y="497" width="4" height="121" rx="2" fill="#a4486a"/><text x="78" y="515" fill="#a4486a" font-size="20" font-weight="600"><tspan x="78" dy="0">Company source evidence</tspan></text><text x="78" y="544" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Grounding IDs; captured original text</tspan><tspan x="78" dy="22.950000000000003">Separate search-summary provenance</tspan><tspan x="78" dy="22.950000000000003">Untrusted content and citation allowlist</tspan></text></g><g data-node="extract" data-x="565" data-y="205" data-w="415" data-h="140"><rect x="565" y="205" width="415" height="140" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="565" y="222" width="4" height="106" rx="2" fill="#7256b0"/><text x="583" y="240" fill="#7256b0" font-size="20" font-weight="600"><tspan x="583" dy="0">Gemini: extract_evidence</tspan></text><text x="583" y="269" fill="#525b6e" font-size="17" font-weight="400"><tspan x="583" dy="0">Scoped facts, not commercial scores</tspan><tspan x="583" dy="22.950000000000003">Original quote, entity, site and date</tspan><tspan x="583" dy="22.950000000000003">Value + unit + original numeric text</tspan></text></g><g data-node="validate" data-x="1095" data-y="205" data-w="440" data-h="155"><rect x="1095" y="205" width="440" height="155" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="1095" y="222" width="4" height="121" rx="2" fill="#7256b0"/><text x="1113" y="240" fill="#7256b0" font-size="20" font-weight="600"><tspan x="1113" dy="0">Code: validate_candidate</tspan></text><text x="1113" y="269" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1113" dy="0">Allowlisted source and product IDs</tspan><tspan x="1113" dy="22.950000000000003">Quote occurrence in captured text</tspan><tspan x="1113" dy="22.950000000000003">Locale-aware number validation</tspan><tspan x="1113" dy="22.950000000000003">Reject unsupported fact captures</tspan></text></g><g data-node="assess" data-x="565" data-y="480" data-w="415" data-h="165"><rect x="565" y="480" width="415" height="165" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="565" y="497" width="4" height="131" rx="2" fill="#7256b0"/><text x="583" y="515" fill="#7256b0" font-size="20" font-weight="600"><tspan x="583" dy="0">Gemini: assess_fit</tspan></text><text x="583" y="544" fill="#525b6e" font-size="17" font-weight="400"><tspan x="583" dy="0">Review every fact against source context</tspan><tspan x="583" dy="22.950000000000003">Entailment, negation, entity, contradictions</tspan><tspan x="583" dy="22.950000000000003">Anchored 0-5 ratings with fact references</tspan><tspan x="583" dy="22.950000000000003">Unknown is null, not a negative score</tspan></text></g><g data-node="score" data-x="1095" data-y="480" data-w="440" data-h="165"><rect x="1095" y="480" width="440" height="165" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="1095" y="497" width="4" height="131" rx="2" fill="#327b67"/><text x="1113" y="515" fill="#327b67" font-size="20" font-weight="600"><tspan x="1113" dy="0">Code: calculate_scores</tspan></text><text x="1113" y="544" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1113" dy="0">Validate judgment and reference contracts</tspan><tspan x="1113" dy="22.950000000000003">Weights 20 / 40 / 20 / 20</tspan><tspan x="1113" dy="22.950000000000003">Known subtotal to unresolved upper bound</tspan><tspan x="1113" dy="22.950000000000003">Coverage and completeness are separate</tspan></text></g><g data-node="gate" data-x="1095" data-y="705" data-w="440" data-h="95"><rect x="1095" y="705" width="440" height="95" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="1095" y="722" width="4" height="61" rx="2" fill="#966419"/><text x="1113" y="740" fill="#966419" font-size="20" font-weight="600"><tspan x="1113" dy="0">Code: technical_gate</tspan></text><text x="1113" y="769" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1113" dy="0">Sourced hard requirements can veto fit</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Quote occurrence is not entailment. Semantic support remains an LLM judgment, even when a source quotation is valid.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">100% criterion coverage is not technical approval, a probability of sale, or proof of material purchasing responsibility.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">CHEMNOVUS CASE STUDY / FICTIONAL MATERIALS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>