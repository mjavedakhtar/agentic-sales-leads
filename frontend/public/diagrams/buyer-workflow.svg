<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Buyer graph: one bounded research branch</title><desc id="desc">backend/buyer_workflow.py: BuyerEngine.graph. Separate checkpoint thread; original shortlist stays frozen.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">Buyer graph: one bounded research branch</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">backend/buyer_workflow.py: BuyerEngine.graph. Separate checkpoint thread; original shortlist stays frozen.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">IMPLEMENTED</tspan></text><rect x="35" y="315" width="1530" height="480" rx="18" fill="#f3f2f7" stroke="#d7d4e3" stroke-dasharray="7 5"/><text x="270" y="343" fill="#7d788e" font-size="15" font-weight="600"><tspan x="270" dy="0">BUYER GRAPH: 4 CUSTOM NODES; CONDITIONAL EDGES, NO RESEARCH LOOP</tspan></text><polyline points="110,292 110,390" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="190,418 270,418" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="670,425 865,425" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="685" y="390" width="156" height="25" rx="4" fill="#faf9fc"/><text x="690" y="408" fill="#72798d" font-size="17" font-weight="400"><tspan x="690" dy="0">Questions remain</tspan></text><polyline points="470,500 470,600" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="480" y="537" width="120" height="25" rx="4" fill="#faf9fc"/><text x="485" y="555" fill="#72798d" font-size="17" font-weight="400"><tspan x="485" dy="0">No questions</tspan></text><polyline points="1067,500 1067,600" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1080" y="537" width="111" height="25" rx="4" fill="#faf9fc"/><text x="1085" y="555" fill="#72798d" font-size="17" font-weight="400"><tspan x="1085" dy="0">New sources</tspan></text><polyline points="1270,425 1440,425 1440,780 620,780 620,745" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1305" y="537" width="102" height="25" rx="4" fill="#faf9fc"/><text x="1310" y="555" fill="#72798d" font-size="17" font-weight="400"><tspan x="1310" dy="0">No sources</tspan></text><polyline points="865,672 670,672" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="270,673 190,673" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="frozen_input" data-x="60" data-y="180" data-w="650" data-h="112"><rect x="60" y="180" width="650" height="112" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="60" y="197" width="4" height="78" rx="2" fill="#327b67"/><text x="78" y="215" fill="#327b67" font-size="20" font-weight="600"><tspan x="78" dy="0">Button: Check buying responsibility</tspan></text><text x="78" y="244" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Copy existing candidates, scope and allowed source captures</tspan><tspan x="78" dy="22.950000000000003">Persist a buyer-check record with its own check_id and budget</tspan></text></g><g data-node="bounds" data-x="795" data-y="180" data-w="740" data-h="112"><rect x="795" y="180" width="740" height="112" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="795" y="197" width="4" height="78" rx="2" fill="#616777"/><text x="813" y="215" fill="#616777" font-size="20" font-weight="600"><tspan x="813" dy="0">Independent limits</tspan></text><text x="813" y="244" fill="#525b6e" font-size="17" font-weight="400"><tspan x="813" dy="0">At most 4 model attempts and 1 targeted search pass</tspan><tspan x="813" dy="22.950000000000003">360-second execution window checked before uncached calls</tspan></text></g><g data-node="START" data-x="60" data-y="390" data-w="130" data-h="56"><rect x="60" y="390" width="130" height="56" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="60" y="407" width="4" height="22" rx="2" fill="#616777"/><text x="78" y="425" fill="#616777" font-size="20" font-weight="600"><tspan x="78" dy="0">START</tspan></text></g><g data-node="assess_existing" data-x="270" data-y="355" data-w="400" data-h="145"><rect x="270" y="355" width="400" height="145" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="270" y="372" width="4" height="111" rx="2" fill="#7256b0"/><text x="288" y="390" fill="#7256b0" font-size="20" font-weight="600"><tspan x="288" dy="0">assess_existing</tspan></text><text x="288" y="419" fill="#525b6e" font-size="17" font-weight="400"><tspan x="288" dy="0">LLM assesses five separate buying roles</tspan><tspan x="288" dy="22.950000000000003">Code requires applicable original quotes</tspan><tspan x="288" dy="22.950000000000003">Freeze initial_candidates for comparison</tspan></text></g><g data-node="targeted_research" data-x="865" data-y="355" data-w="405" data-h="145"><rect x="865" y="355" width="405" height="145" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="865" y="372" width="4" height="111" rx="2" fill="#a4486a"/><text x="883" y="390" fill="#a4486a" font-size="20" font-weight="600"><tspan x="883" dy="0">targeted_research</tspan></text><text x="883" y="419" fill="#525b6e" font-size="17" font-weight="400"><tspan x="883" dy="0">One Google-grounded follow-up search</tspan><tspan x="883" dy="22.950000000000003">Reserve budget before provider call</tspan><tspan x="883" dy="22.950000000000003">Keep new sources marked followup</tspan></text></g><g data-node="assess_followup" data-x="865" data-y="600" data-w="405" data-h="145"><rect x="865" y="600" width="405" height="145" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="865" y="617" width="4" height="111" rx="2" fill="#7256b0"/><text x="883" y="635" fill="#7256b0" font-size="20" font-weight="600"><tspan x="883" dy="0">assess_followup</tspan></text><text x="883" y="664" fill="#525b6e" font-size="17" font-weight="400"><tspan x="883" dy="0">LLM assesses original + new evidence</tspan><tspan x="883" dy="22.950000000000003">Promotion requires new purchasing proof</tspan><tspan x="883" dy="22.950000000000003">At most 2 new buyers; no invented score</tspan></text></g><g data-node="complete" data-x="270" data-y="600" data-w="400" data-h="145"><rect x="270" y="600" width="400" height="145" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="270" y="617" width="4" height="111" rx="2" fill="#327b67"/><text x="288" y="635" fill="#327b67" font-size="20" font-weight="600"><tspan x="288" dy="0">complete</tspan></text><text x="288" y="664" fill="#525b6e" font-size="17" font-weight="400"><tspan x="288" dy="0">Save comparison, evidence and usage</tspan><tspan x="288" dy="22.950000000000003">Unknowns remain visible for review</tspan><tspan x="288" dy="22.950000000000003">Scores, decisions and pipeline unchanged</tspan></text></g><g data-node="END" data-x="60" data-y="645" data-w="130" data-h="56"><rect x="60" y="645" width="130" height="56" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="60" y="662" width="4" height="22" rx="2" fill="#616777"/><text x="78" y="680" fill="#616777" font-size="20" font-weight="600"><tspan x="78" dy="0">END</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Normal path: 1 assessment call, or 3 calls with follow-up. Saved responses support retries; an uncertain search is not repeated.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">A buyer claim needs product match, entity, timing and relation support. Buying responsibility does not establish buying intent.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">TECHNOVA CASE STUDY / FICTIONAL SOFTWARE PRODUCTS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>