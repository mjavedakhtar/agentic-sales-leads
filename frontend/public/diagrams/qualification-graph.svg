<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Qualification graph: the human decision</title><desc id="desc">backend/workflows.py: Engine.qualification. Two custom nodes, one thread per original run and lead.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">Qualification graph: the human decision</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">backend/workflows.py: Engine.qualification. Two custom nodes, one thread per original run and lead.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">IMPLEMENTED</tspan></text><rect x="35" y="330" width="1530" height="205" rx="18" fill="#f3f2f7" stroke="#d7d4e3" stroke-dasharray="7 5"/><text x="55" y="358" fill="#7d788e" font-size="15" font-weight="600"><tspan x="55" dy="0">QUALIFICATION GRAPH / 2 CUSTOM NODES</tspan></text><polyline points="205,428 355,428" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="550,310 550,360" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="745,432 905,432" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="781" y="394" width="66" height="25" rx="4" fill="#faf9fc"/><text x="786" y="412" fill="#72798d" font-size="17" font-weight="400"><tspan x="786" dy="0">Resume</tspan></text><polyline points="1295,428 1400,428" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="960,505 960,570 290,570 290,635" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1060,505 1060,595 805,595 805,635" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="810" y="604" width="75" height="25" rx="4" fill="#faf9fc"/><text x="815" y="622" fill="#72798d" font-size="17" font-weight="400"><tspan x="815" dy="0">approve</tspan></text><polyline points="1190,505 1190,570 1320,570 1320,635" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1275" y="534" width="147" height="25" rx="4" fill="#faf9fc"/><text x="1280" y="552" fill="#72798d" font-size="17" font-weight="400"><tspan x="1280" dy="0">other decisions</tspan></text><g data-node="human_resume" data-x="355" data-y="180" data-w="905" data-h="130"><rect x="355" y="180" width="905" height="130" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="355" y="197" width="4" height="96" rx="2" fill="#966419"/><text x="373" y="215" fill="#966419" font-size="20" font-weight="600"><tspan x="373" dy="0">Engine.decide validates the action before resuming</tspan></text><text x="373" y="244" fill="#525b6e" font-size="17" font-weight="400"><tspan x="373" dy="0">Research must be complete; a technical block prevents approval; an existing decision is final</tspan><tspan x="373" dy="22.950000000000003">Command(resume={decision, note}); thread_id = review:{run_id}:{lead_id}</tspan><tspan x="373" dy="22.950000000000003">No LLM call; no human wait occupies a background worker</tspan></text></g><g data-node="START" data-x="60" data-y="400" data-w="145" data-h="56"><rect x="60" y="400" width="145" height="56" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="60" y="417" width="4" height="22" rx="2" fill="#616777"/><text x="78" y="435" fill="#616777" font-size="20" font-weight="600"><tspan x="78" dy="0">START</tspan></text></g><g data-node="human_decision" data-x="355" data-y="360" data-w="390" data-h="145"><rect x="355" y="360" width="390" height="145" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="355" y="377" width="4" height="111" rx="2" fill="#966419"/><text x="373" y="395" fill="#966419" font-size="20" font-weight="600"><tspan x="373" dy="0">human_decision</tspan></text><text x="373" y="424" fill="#525b6e" font-size="17" font-weight="400"><tspan x="373" dy="0">interrupt: lead_qualification</tspan><tspan x="373" dy="22.950000000000003">Allowed: approve / reject / needs_research</tspan><tspan x="373" dy="22.950000000000003">Resume stores the decision and note</tspan></text></g><g data-node="persist_decision" data-x="905" data-y="360" data-w="390" data-h="145"><rect x="905" y="360" width="390" height="145" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="905" y="377" width="4" height="111" rx="2" fill="#327b67"/><text x="923" y="395" fill="#327b67" font-size="20" font-weight="600"><tspan x="923" dy="0">persist_decision</tspan></text><text x="923" y="424" fill="#525b6e" font-size="17" font-weight="400"><tspan x="923" dy="0">Store.save_decision(...)</tspan><tspan x="923" dy="22.950000000000003">Transactional review + pipeline update</tspan><tspan x="923" dy="22.950000000000003">Return saved=True</tspan></text></g><g data-node="END" data-x="1400" data-y="400" data-w="145" data-h="56"><rect x="1400" y="400" width="145" height="56" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="1400" y="417" width="4" height="22" rx="2" fill="#616777"/><text x="1418" y="435" fill="#616777" font-size="20" font-weight="600"><tspan x="1418" dy="0">END</tspan></text></g><g data-node="decision_record" data-x="70" data-y="635" data-w="440" data-h="130"><rect x="70" y="635" width="440" height="130" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="70" y="652" width="4" height="96" rx="2" fill="#327b67"/><text x="88" y="670" fill="#327b67" font-size="20" font-weight="600"><tspan x="88" dy="0">Decision record</tspan></text><text x="88" y="699" fill="#525b6e" font-size="17" font-weight="400"><tspan x="88" dy="0">Key: run_id + lead_id</tspan><tspan x="88" dy="22.950000000000003">Decision, note, recorded timestamp</tspan><tspan x="88" dy="22.950000000000003">Reload and restart retain it</tspan></text></g><g data-node="approved" data-x="585" data-y="635" data-w="440" data-h="130"><rect x="585" y="635" width="440" height="130" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="585" y="652" width="4" height="96" rx="2" fill="#327b67"/><text x="603" y="670" fill="#327b67" font-size="20" font-weight="600"><tspan x="603" dy="0">Approve</tspan></text><text x="603" y="699" fill="#525b6e" font-size="17" font-weight="400"><tspan x="603" dy="0">Create a local pipeline opportunity</tspan><tspan x="603" dy="22.950000000000003">Same transaction as review persistence</tspan><tspan x="603" dy="22.950000000000003">Idempotent matching resubmission</tspan></text></g><g data-node="other_decisions" data-x="1100" data-y="635" data-w="440" data-h="130"><rect x="1100" y="635" width="440" height="130" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="1100" y="652" width="4" height="96" rx="2" fill="#616777"/><text x="1118" y="670" fill="#616777" font-size="20" font-weight="600"><tspan x="1118" dy="0">Reject or needs research</tspan></text><text x="1118" y="699" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1118" dy="0">Save the decision and note</tspan><tspan x="1118" dy="22.950000000000003">No pipeline entry or automatic research</tspan><tspan x="1118" dy="22.950000000000003">A new run does not inherit this review</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">The buyer-check button starts a different graph. A needs_research decision does not trigger that graph or a follow-up task.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Current decisions are final within the run. Production needs reviewer identity, evidence versions and authorized reassessment.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">TECHNOVA CASE STUDY / FICTIONAL SOFTWARE PRODUCTS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>