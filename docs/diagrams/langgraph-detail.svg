<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Research graph: the exact code path</title><desc id="desc">backend/workflows.py: Engine.research. Eight custom nodes; fixed edges; one scope interrupt.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">Research graph: the exact code path</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">backend/workflows.py: Engine.research. Eight custom nodes; fixed edges; one scope interrupt.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">IMPLEMENTED</tspan></text><rect x="35" y="305" width="1530" height="430" rx="18" fill="#f3f2f7" stroke="#d7d4e3" stroke-dasharray="7 5"/><text x="55" y="333" fill="#7d788e" font-size="15" font-weight="600"><tspan x="55" dy="0">RESEARCH GRAPH / 8 CUSTOM NODES</tspan></text><polyline points="450,235 505,235" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="570,263 570,350 220,350 220,360" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1135,292 1135,343 350,343 350,360" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="675" y="307" width="210" height="25" rx="4" fill="#faf9fc"/><text x="680" y="325" fill="#72798d" font-size="17" font-weight="400"><tspan x="680" dy="0">Resume same checkpoint</tspan></text><polyline points="380,425 445,425" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="765,425 830,425" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1150,425 1215,425" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1375,490 1375,590" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1215,655 1150,655" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="830,655 765,655" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="445,655 380,655" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="212,720 212,750" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="parse_scope" data-x="60" data-y="180" data-w="390" data-h="112"><rect x="60" y="180" width="390" height="112" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="60" y="197" width="4" height="78" rx="2" fill="#a4486a"/><text x="78" y="215" fill="#a4486a" font-size="20" font-weight="600"><tspan x="78" dy="0">parse_scope (before graph)</tspan></text><text x="78" y="244" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Gemini call 1 of 4; no web search</tspan><tspan x="78" dy="22.950000000000003">Runs before generating run_id</tspan></text></g><g data-node="START" data-x="505" data-y="207" data-w="135" data-h="56"><rect x="505" y="207" width="135" height="56" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="505" y="224" width="4" height="22" rx="2" fill="#616777"/><text x="523" y="242" fill="#616777" font-size="20" font-weight="600"><tspan x="523" dy="0">START</tspan></text></g><g data-node="resume_scope" data-x="735" data-y="180" data-w="800" data-h="112"><rect x="735" y="180" width="800" height="112" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="735" y="197" width="4" height="78" rx="2" fill="#966419"/><text x="753" y="215" fill="#966419" font-size="20" font-weight="600"><tspan x="753" dy="0">Human confirms the displayed scope</tspan></text><text x="753" y="244" fill="#525b6e" font-size="17" font-weight="400"><tspan x="753" dy="0">confirm_scope calls interrupt(...); confirmation resumes that same thread</tspan><tspan x="753" dy="22.950000000000003">Command(resume=True); thread_id = run_id; no worker held while waiting</tspan></text></g><g data-node="confirm_scope" data-x="60" data-y="360" data-w="320" data-h="130"><rect x="60" y="360" width="320" height="130" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="60" y="377" width="4" height="96" rx="2" fill="#966419"/><text x="78" y="395" fill="#966419" font-size="20" font-weight="600"><tspan x="78" dy="0">confirm_scope</tspan></text><text x="78" y="424" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">interrupt: scope_confirmation</tspan><tspan x="78" dy="22.950000000000003">Resume must be exactly True</tspan><tspan x="78" dy="22.950000000000003">Then mark scope confirmed</tspan></text></g><g data-node="retrieve_product" data-x="445" data-y="360" data-w="320" data-h="130"><rect x="445" y="360" width="320" height="130" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="445" y="377" width="4" height="96" rx="2" fill="#327b67"/><text x="463" y="395" fill="#327b67" font-size="20" font-weight="600"><tspan x="463" dy="0">retrieve_product</tspan></text><text x="463" y="424" fill="#525b6e" font-size="17" font-weight="400"><tspan x="463" dy="0">BM25 over selected-product chunks</tspan><tspan x="463" dy="22.950000000000003">Page citations; no model call</tspan><tspan x="463" dy="22.950000000000003">Store retrieved_chunks</tspan></text></g><g data-node="discover_candidates" data-x="830" data-y="360" data-w="320" data-h="130"><rect x="830" y="360" width="320" height="130" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="830" y="377" width="4" height="96" rx="2" fill="#a4486a"/><text x="848" y="395" fill="#a4486a" font-size="20" font-weight="600"><tspan x="848" dy="0">discover_candidates</tspan></text><text x="848" y="424" fill="#525b6e" font-size="17" font-weight="400"><tspan x="848" dy="0">Gemini call 2: Google Search</tspan><tspan x="848" dy="22.950000000000003">Bounded cited-page capture</tspan><tspan x="848" dy="22.950000000000003">Store research + grounded sources</tspan></text></g><g data-node="extract_evidence" data-x="1215" data-y="360" data-w="320" data-h="130"><rect x="1215" y="360" width="320" height="130" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="1215" y="377" width="4" height="96" rx="2" fill="#7256b0"/><text x="1233" y="395" fill="#7256b0" font-size="20" font-weight="600"><tspan x="1233" dy="0">extract_evidence</tspan></text><text x="1233" y="424" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1233" dy="0">Gemini call 3: extract scoped facts</tspan><tspan x="1233" dy="22.950000000000003">Code checks citations and quantities</tspan><tspan x="1233" dy="22.950000000000003">Store validated extraction</tspan></text></g><g data-node="assess_fit" data-x="1215" data-y="590" data-w="320" data-h="130"><rect x="1215" y="590" width="320" height="130" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="1215" y="607" width="4" height="96" rx="2" fill="#7256b0"/><text x="1233" y="625" fill="#7256b0" font-size="20" font-weight="600"><tspan x="1233" dy="0">assess_fit</tspan></text><text x="1233" y="654" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1233" dy="0">Gemini call 4: semantic review</tspan><tspan x="1233" dy="22.950000000000003">Criterion ratings with evidence IDs</tspan><tspan x="1233" dy="22.950000000000003">Empty extraction skips model call</tspan></text></g><g data-node="calculate_scores" data-x="830" data-y="590" data-w="320" data-h="130"><rect x="830" y="590" width="320" height="130" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="830" y="607" width="4" height="96" rx="2" fill="#7256b0"/><text x="848" y="625" fill="#7256b0" font-size="20" font-weight="600"><tspan x="848" dy="0">calculate_scores</tspan></text><text x="848" y="654" fill="#525b6e" font-size="17" font-weight="400"><tspan x="848" dy="0">Code applies 20 / 40 / 20 / 20</tspan><tspan x="848" dy="22.950000000000003">Unknowns create a score range</tspan><tspan x="848" dy="22.950000000000003">Coverage differs from completeness</tspan></text></g><g data-node="technical_gate" data-x="445" data-y="590" data-w="320" data-h="130"><rect x="445" y="590" width="320" height="130" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="445" y="607" width="4" height="96" rx="2" fill="#7256b0"/><text x="463" y="625" fill="#7256b0" font-size="20" font-weight="600"><tspan x="463" dy="0">technical_gate</tspan></text><text x="463" y="654" fill="#525b6e" font-size="17" font-weight="400"><tspan x="463" dy="0">Code checks sourced requirements</tspan><tspan x="463" dy="22.950000000000003">Known mismatch remains blocked</tspan><tspan x="463" dy="22.950000000000003">Unknown suitability needs review</tspan></text></g><g data-node="rank_candidates" data-x="60" data-y="590" data-w="320" data-h="130"><rect x="60" y="590" width="320" height="130" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="60" y="607" width="4" height="96" rx="2" fill="#327b67"/><text x="78" y="625" fill="#327b67" font-size="20" font-weight="600"><tspan x="78" dy="0">rank_candidates</tspan></text><text x="78" y="654" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Blocked last, then score lower bound</tspan><tspan x="78" dy="22.950000000000003">Return the completed shortlist</tspan><tspan x="78" dy="22.950000000000003">Runner creates review threads later</tspan></text></g><g data-node="END" data-x="145" data-y="750" data-w="135" data-h="54"><rect x="145" y="750" width="135" height="54" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="145" y="767" width="4" height="20" rx="2" fill="#616777"/><text x="163" y="785" fill="#616777" font-size="20" font-weight="600"><tspan x="163" dy="0">END</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Each successful node checkpoints. Retry resumes snapshot.next. The 5-attempt budget includes failures and model fallback.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Replay uses the same graph with captured inputs: assess_fit and calculate_scores are no-ops; no fresh model calls.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">CHEMNOVUS CASE STUDY / FICTIONAL MATERIALS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>