<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The architecture on this laptop</title><desc id="desc">One FastAPI process, two independent background executors, and three checkpointed graphs.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">The architecture on this laptop</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">One FastAPI process, two independent background executors, and three checkpointed graphs.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">IMPLEMENTED</tspan></text><rect x="35" y="170" width="1100" height="620" rx="18" fill="#f3f2f7" stroke="#d7d4e3" stroke-dasharray="7 5"/><text x="55" y="198" fill="#7d788e" font-size="15" font-weight="600"><tspan x="55" dy="0">LOCAL PROCESS AND STORAGE</tspan></text><rect x="1160" y="170" width="405" height="440" rx="18" fill="#f3f2f7" stroke="#d7d4e3" stroke-dasharray="7 5"/><text x="1180" y="198" fill="#7d788e" font-size="15" font-weight="600"><tspan x="1180" dy="0">EXTERNAL NETWORK</tspan></text><polyline points="350,270 435,270" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="360" y="232" width="48" height="25" rx="4" fill="#faf9fc"/><text x="365" y="250" fill="#72798d" font-size="17" font-weight="400"><tspan x="365" dy="0">HTTP</tspan></text><polyline points="585,327 585,430" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="950,327 950,430" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1085,270 1190,270" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1095" y="232" width="57" height="25" rx="4" fill="#faf9fc"/><text x="1100" y="250" fill="#72798d" font-size="17" font-weight="400"><tspan x="1100" dy="0">Scope</tspan></text><polyline points="735,470 760,470 760,385 1150,385 1150,320 1190,320" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1110,470 1165,470 1165,340 1190,340" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="435,515 350,515" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="585,570 585,655" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="950,570 950,655" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1110,530 1190,530" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="735,550 760,550 760,615 1150,615 1150,565 1190,565" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="browser" data-x="60" data-y="215" data-w="290" data-h="112"><rect x="60" y="215" width="290" height="112" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="60" y="232" width="4" height="78" rx="2" fill="#7256b0"/><text x="78" y="250" fill="#7256b0" font-size="20" font-weight="600"><tspan x="78" dy="0">React application</tspan></text><text x="78" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Separate task routes</tspan><tspan x="78" dy="22.950000000000003">Polling reads over local HTTP</tspan></text></g><g data-node="api" data-x="435" data-y="215" data-w="650" data-h="112"><rect x="435" y="215" width="650" height="112" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="435" y="232" width="4" height="78" rx="2" fill="#7256b0"/><text x="453" y="250" fill="#7256b0" font-size="20" font-weight="600"><tspan x="453" dy="0">FastAPI + static UI</tspan></text><text x="453" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="453" dy="0">Localhost :8040; request validation and application APIs</tspan><tspan x="453" dy="22.950000000000003">parse_scope runs before the research graph and run ID</tspan></text></g><g data-node="engine" data-x="435" data-y="430" data-w="300" data-h="140"><rect x="435" y="430" width="300" height="140" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="435" y="447" width="4" height="106" rx="2" fill="#7256b0"/><text x="453" y="465" fill="#7256b0" font-size="20" font-weight="600"><tspan x="453" dy="0">Engine</tspan></text><text x="453" y="494" fill="#525b6e" font-size="17" font-weight="400"><tspan x="453" dy="0">Research graph: 8 nodes</tspan><tspan x="453" dy="22.950000000000003">Qualification graph: 2 nodes</tspan><tspan x="453" dy="22.950000000000003">1 worker; shared graph lock</tspan></text></g><g data-node="buyers" data-x="790" data-y="430" data-w="320" data-h="140"><rect x="790" y="430" width="320" height="140" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="790" y="447" width="4" height="106" rx="2" fill="#7256b0"/><text x="808" y="465" fill="#7256b0" font-size="20" font-weight="600"><tspan x="808" dy="0">BuyerEngine</tspan></text><text x="808" y="494" fill="#525b6e" font-size="17" font-weight="400"><tspan x="808" dy="0">Optional buyer graph: 4 nodes</tspan><tspan x="808" dy="22.950000000000003">1 separate worker and graph lock</tspan><tspan x="808" dy="22.950000000000003">Own queue-admission job lock</tspan></text></g><g data-node="product" data-x="60" data-y="440" data-w="290" data-h="130"><rect x="60" y="440" width="290" height="130" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="60" y="457" width="4" height="96" rx="2" fill="#327b67"/><text x="78" y="475" fill="#327b67" font-size="20" font-weight="600"><tspan x="78" dy="0">Product corpus</tspan></text><text x="78" y="504" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Two fictional PDFs</tspan><tspan x="78" dy="22.950000000000003">Product-filtered BM25</tspan><tspan x="78" dy="22.950000000000003">Page-addressable chunks</tspan></text></g><g data-node="db" data-x="435" data-y="655" data-w="675" data-h="125"><rect x="435" y="655" width="675" height="125" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="435" y="672" width="4" height="91" rx="2" fill="#327b67"/><text x="453" y="690" fill="#327b67" font-size="20" font-weight="600"><tspan x="453" dy="0">SQLite: business state and two checkpoint files</tspan></text><text x="453" y="719" fill="#525b6e" font-size="17" font-weight="400"><tspan x="453" dy="0">leadgen.db: runs, reviews, pipeline, buyer checks</tspan><tspan x="453" dy="22.950000000000003">leadgen.db.checkpoints: research + qualification</tspan><tspan x="453" dy="22.950000000000003">leadgen.db.buyer-checkpoints: buyer graph</tspan></text></g><g data-node="config" data-x="60" data-y="655" data-w="290" data-h="115"><rect x="60" y="655" width="290" height="115" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="60" y="672" width="4" height="81" rx="2" fill="#616777"/><text x="78" y="690" fill="#616777" font-size="20" font-weight="600"><tspan x="78" dy="0">Local configuration</tspan></text><text x="78" y="719" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Ignored .env; server-side key</tspan><tspan x="78" dy="22.950000000000003">Browser never receives the key</tspan></text></g><g data-node="gemini" data-x="1190" data-y="215" data-w="345" data-h="140"><rect x="1190" y="215" width="345" height="140" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="1190" y="232" width="4" height="106" rx="2" fill="#a4486a"/><text x="1208" y="250" fill="#a4486a" font-size="20" font-weight="600"><tspan x="1208" dy="0">Gemini API</tspan></text><text x="1208" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1208" dy="0">Scope, discovery, extraction, fit</tspan><tspan x="1208" dy="22.950000000000003">Optional buying-role assessment</tspan><tspan x="1208" dy="22.950000000000003">Google Search only on search calls</tspan></text></g><g data-node="web" data-x="1190" data-y="455" data-w="345" data-h="130"><rect x="1190" y="455" width="345" height="130" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="1190" y="472" width="4" height="96" rx="2" fill="#a4486a"/><text x="1208" y="490" fill="#a4486a" font-size="20" font-weight="600"><tspan x="1208" dy="0">Public websites</tspan></text><text x="1208" y="519" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1208" dy="0">Fetch grounded citations only</tspan><tspan x="1208" dy="22.950000000000003">Public-IP and redirect checks</tspan><tspan x="1208" dy="22.950000000000003">Captures remain untrusted input</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Research and buyer checks can run concurrently. Research/review share one graph lock; buyer checks use another.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">The executors and admission locks are local, not a durable distributed queue. No cloud resources are deployed.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">TECHNOVA CASE STUDY / FICTIONAL SOFTWARE PRODUCTS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>