<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Human waits, saved decisions and production resume</title><desc id="desc">The demo persists scope and qualification interrupts. Production adds identity, version checks and durable dispatch.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">Human waits, saved decisions and production resume</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">The demo persists scope and qualification interrupts. Production adds identity, version checks and durable dispatch.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">DEMO TO PRODUCTION</tspan></text><rect x="35" y="190" width="1530" height="235" rx="18" fill="#f3f2f7" stroke="#d7d4e3" stroke-dasharray="7 5"/><text x="55" y="218" fill="#7d788e" font-size="15" font-weight="600"><tspan x="55" dy="0">IMPLEMENTED: LOCAL HUMAN-IN-THE-LOOP</tspan></text><rect x="35" y="550" width="1530" height="235" rx="18" fill="#f3f2f7" stroke="#d7d4e3" stroke-dasharray="7 5"/><text x="55" y="578" fill="#7d788e" font-size="15" font-weight="600"><tspan x="55" dy="0">PROPOSED AWS: AUTHORIZED AND VERSIONED RESUME</tspan></text><polyline points="495,320 580,320" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1015,320 1100,320" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="495,680 580,680" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1015,680 1100,680" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="wait_now" data-x="60" data-y="245" data-w="435" data-h="150"><rect x="60" y="245" width="435" height="150" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="60" y="262" width="4" height="116" rx="2" fill="#966419"/><text x="78" y="280" fill="#966419" font-size="20" font-weight="600"><tspan x="78" dy="0">Persist an interrupt</tspan></text><text x="78" y="309" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Scope: confirm_scope in research</tspan><tspan x="78" dy="22.950000000000003">Lead: human_decision in qualification</tspan><tspan x="78" dy="22.950000000000003">SQLite checkpoint; release execution</tspan></text></g><g data-node="resume_now" data-x="580" data-y="245" data-w="435" data-h="150"><rect x="580" y="245" width="435" height="150" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="580" y="262" width="4" height="116" rx="2" fill="#7256b0"/><text x="598" y="280" fill="#7256b0" font-size="20" font-weight="600"><tspan x="598" dy="0">Resume the same thread</tspan></text><text x="598" y="309" fill="#525b6e" font-size="17" font-weight="400"><tspan x="598" dy="0">Command(resume=...)</tspan><tspan x="598" dy="22.950000000000003">Backend validates completed research</tspan><tspan x="598" dy="22.950000000000003">A hard mismatch prevents approval</tspan></text></g><g data-node="save_now" data-x="1100" data-y="245" data-w="435" data-h="150"><rect x="1100" y="245" width="435" height="150" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="1100" y="262" width="4" height="116" rx="2" fill="#327b67"/><text x="1118" y="280" fill="#327b67" font-size="20" font-weight="600"><tspan x="1118" dy="0">Save the current decision</tspan></text><text x="1118" y="309" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1118" dy="0">Review and note persist by run + lead</tspan><tspan x="1118" dy="22.950000000000003">Approve also creates local opportunity</tspan><tspan x="1118" dy="22.950000000000003">Needs research records a decision only</tspan></text></g><g data-node="authorize" data-x="60" data-y="605" data-w="435" data-h="150"><rect x="60" y="605" width="435" height="150" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="60" y="622" width="4" height="116" rx="2" fill="#426eb0"/><text x="78" y="640" fill="#426eb0" font-size="20" font-weight="600"><tspan x="78" dy="0">Authorize the returning reviewer</tspan></text><text x="78" y="669" fill="#525b6e" font-size="17" font-weight="400"><tspan x="78" dy="0">Product / account permissions</tspan><tspan x="78" dy="22.950000000000003">Current evidence and policy version</tspan><tspan x="78" dy="22.950000000000003">Stale decisions require fresh review</tspan></text></g><g data-node="resume_job" data-x="580" data-y="605" data-w="435" data-h="150"><rect x="580" y="605" width="435" height="150" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="580" y="622" width="4" height="116" rx="2" fill="#426eb0"/><text x="598" y="640" fill="#426eb0" font-size="20" font-weight="600"><tspan x="598" dy="0">Dispatch a durable resume job</tspan></text><text x="598" y="669" fill="#525b6e" font-size="17" font-weight="400"><tspan x="598" dy="0">New short-lived job and lease</tspan><tspan x="598" dy="22.950000000000003">Load the matching saved checkpoint</tspan><tspan x="598" dy="22.950000000000003">No long-lived worker for human waits</tspan></text></g><g data-node="commit" data-x="1100" data-y="605" data-w="435" data-h="150"><rect x="1100" y="605" width="435" height="150" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="1100" y="622" width="4" height="116" rx="2" fill="#327b67"/><text x="1118" y="640" fill="#327b67" font-size="20" font-weight="600"><tspan x="1118" dy="0">Commit decision and consequence</tspan></text><text x="1118" y="669" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1118" dy="0">Atomic decision + CRM outbox</tspan><tspan x="1118" dy="22.950000000000003">Idempotent downstream delivery</tspan><tspan x="1118" dy="22.950000000000003">Retain review and evidence history</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Current decisions are final for that run. New runs do not automatically carry a company review forward.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">The optional buyer comparison preserves original human decisions; it does not authorize outreach or CRM writes.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">TECHNOVA CASE STUDY / FICTIONAL SOFTWARE PRODUCTS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>