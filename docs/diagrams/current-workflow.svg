<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The workflow running today</title><desc id="desc">Fixed research stages, a separate human decision, and an optional buying-responsibility check.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">The workflow running today</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">Fixed research stages, a separate human decision, and an optional buying-responsibility check.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">IMPLEMENTED</tspan></text><polyline points="325,285 360,285" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="630,285 665,285" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="935,285 970,285" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1240,285 1275,285" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1410,364 1410,475" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="885,540 715,540" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="760" y="504" width="66" height="25" rx="4" fill="#faf9fc"/><text x="765" y="522" fill="#72798d" font-size="17" font-weight="400"><tspan x="765" dy="0">Button</tspan></text><polyline points="252,605 252,670" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1030,605 1030,635 890,635 890,670" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1085,725 1150,725" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="scope" data-x="55" data-y="210" data-w="270" data-h="154"><rect x="55" y="210" width="270" height="154" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="55" y="227" width="4" height="120" rx="2" fill="#966419"/><text x="73" y="245" fill="#966419" font-size="20" font-weight="600"><tspan x="73" dy="0">Confirm the scope</tspan></text><text x="73" y="274" fill="#525b6e" font-size="17" font-weight="400"><tspan x="73" dy="0">Gemini interprets the brief</tspan><tspan x="73" dy="22.950000000000003">Human reviews before search</tspan><tspan x="73" dy="22.950000000000003">Product, application, geography</tspan></text></g><g data-node="research" data-x="360" data-y="210" data-w="270" data-h="154"><rect x="360" y="210" width="270" height="154" rx="13" fill="#faeaf0" stroke="#a4486a" stroke-opacity=".24"/><rect x="360" y="227" width="4" height="120" rx="2" fill="#a4486a"/><text x="378" y="245" fill="#a4486a" font-size="20" font-weight="600"><tspan x="378" dy="0">Retrieve and research</tspan></text><text x="378" y="274" fill="#525b6e" font-size="17" font-weight="400"><tspan x="378" dy="0">BM25 product passages</tspan><tspan x="378" dy="22.950000000000003">Google-grounded discovery</tspan><tspan x="378" dy="22.950000000000003">Bounded cited-page capture</tspan></text></g><g data-node="extract" data-x="665" data-y="210" data-w="270" data-h="154"><rect x="665" y="210" width="270" height="154" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="665" y="227" width="4" height="120" rx="2" fill="#7256b0"/><text x="683" y="245" fill="#7256b0" font-size="20" font-weight="600"><tspan x="683" dy="0">Extract source facts</tspan></text><text x="683" y="274" fill="#525b6e" font-size="17" font-weight="400"><tspan x="683" dy="0">Gemini structured extraction</tspan><tspan x="683" dy="22.950000000000003">Code checks quote and value</tspan><tspan x="683" dy="22.950000000000003">Original language and entity</tspan></text></g><g data-node="assess" data-x="970" data-y="210" data-w="270" data-h="154"><rect x="970" y="210" width="270" height="154" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="970" y="227" width="4" height="120" rx="2" fill="#7256b0"/><text x="988" y="245" fill="#7256b0" font-size="20" font-weight="600"><tspan x="988" dy="0">Assess against rubric</tspan></text><text x="988" y="274" fill="#525b6e" font-size="17" font-weight="400"><tspan x="988" dy="0">Gemini checks fact meaning</tspan><tspan x="988" dy="22.950000000000003">Four criterion ratings, 0-5</tspan><tspan x="988" dy="22.950000000000003">Reasons, citations, unknowns</tspan></text></g><g data-node="calculate" data-x="1275" data-y="210" data-w="270" data-h="154"><rect x="1275" y="210" width="270" height="154" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="1275" y="227" width="4" height="120" rx="2" fill="#7256b0"/><text x="1293" y="245" fill="#7256b0" font-size="20" font-weight="600"><tspan x="1293" dy="0">Calculate and gate</tspan></text><text x="1293" y="274" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1293" dy="0">Code applies fixed weights</tspan><tspan x="1293" dy="22.950000000000003">Score range; evidence support</tspan><tspan x="1293" dy="22.950000000000003">Known mismatch blocks</tspan></text></g><g data-node="shortlist" data-x="885" data-y="475" data-w="660" data-h="130"><rect x="885" y="475" width="660" height="130" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="885" y="492" width="4" height="96" rx="2" fill="#327b67"/><text x="903" y="510" fill="#327b67" font-size="20" font-weight="600"><tspan x="903" dy="0">Saved commercial shortlist</tspan></text><text x="903" y="539" fill="#525b6e" font-size="17" font-weight="400"><tspan x="903" dy="0">Rank by score lower bound, with technical blocks last</tspan><tspan x="903" dy="22.950000000000003">Coverage and completeness remain separate from fit</tspan><tspan x="903" dy="22.950000000000003">Original evidence, scores and later decisions are retained</tspan></text></g><g data-node="buyer" data-x="55" data-y="475" data-w="660" data-h="130"><rect x="55" y="475" width="660" height="130" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="55" y="492" width="4" height="96" rx="2" fill="#7256b0"/><text x="73" y="510" fill="#7256b0" font-size="20" font-weight="600"><tspan x="73" dy="0">Optional: check buying responsibility</tspan></text><text x="73" y="539" fill="#525b6e" font-size="17" font-weight="400"><tspan x="73" dy="0">Assess the same saved evidence before seeking anything new</tspan><tspan x="73" dy="22.950000000000003">At most one targeted search, then reassess its evidence</tspan><tspan x="73" dy="22.950000000000003">Licensing, platform use and specification are separate</tspan></text></g><g data-node="comparison" data-x="55" data-y="670" data-w="395" data-h="112"><rect x="55" y="670" width="395" height="112" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="55" y="687" width="4" height="78" rx="2" fill="#327b67"/><text x="73" y="705" fill="#327b67" font-size="20" font-weight="600"><tspan x="73" dy="0">Buyer comparison</tspan></text><text x="73" y="734" fill="#525b6e" font-size="17" font-weight="400"><tspan x="73" dy="0">Original evidence / new evidence</tspan><tspan x="73" dy="22.950000000000003">Commercial scores stay unchanged</tspan></text></g><g data-node="review" data-x="690" data-y="670" data-w="395" data-h="112"><rect x="690" y="670" width="395" height="112" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="690" y="687" width="4" height="78" rx="2" fill="#966419"/><text x="708" y="705" fill="#966419" font-size="20" font-weight="600"><tspan x="708" dy="0">Human qualification</tspan></text><text x="708" y="734" fill="#525b6e" font-size="17" font-weight="400"><tspan x="708" dy="0">Approve, reject or needs research</tspan><tspan x="708" dy="22.950000000000003">A separate review thread per lead</tspan></text></g><g data-node="persist" data-x="1150" data-y="670" data-w="395" data-h="112"><rect x="1150" y="670" width="395" height="112" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="1150" y="687" width="4" height="78" rx="2" fill="#327b67"/><text x="1168" y="705" fill="#327b67" font-size="20" font-weight="600"><tspan x="1168" dy="0">Persist the decision</tspan></text><text x="1168" y="734" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1168" dy="0">Review + note in SQLite</tspan><tspan x="1168" dy="22.950000000000003">Only approved leads enter pipeline</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Three compiled graphs: research has 8 custom nodes, qualification 2, and buyer comparison 4. START / END are excluded.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Normal live research uses 4 model calls with a 5-attempt limit. Buyer checks have a separate 4-attempt / 1-search limit.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">TECHNOVA CASE STUDY / FICTIONAL SOFTWARE PRODUCTS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>