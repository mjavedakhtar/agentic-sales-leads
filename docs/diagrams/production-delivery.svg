<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Release the workflow and prove it can operate</title><desc id="desc">Version the full decision system, evaluate its claims, and exercise recovery before widening access.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8990a4" stroke-width="1.3"/></marker></defs><g font-family="Inter, Arial, sans-serif"><rect width="1600" height="900" fill="#faf9fc"/><text x="55" y="49" fill="#7b6d93" font-size="16" font-weight="600"><tspan x="55" dy="0">LEADGEN / TECHNICAL BLUEPRINT</tspan></text><text x="55" y="104" fill="#292c3c" font-size="39" font-weight="600"><tspan x="55" dy="0">Release the workflow and prove it can operate</tspan></text><text x="55" y="139" fill="#697083" font-size="21" font-weight="400"><tspan x="55" dy="0">Version the full decision system, evaluate its claims, and exercise recovery before widening access.</tspan></text><text x="1260" y="49" fill="#567e9d" font-size="16" font-weight="600"><tspan x="1260" dy="0">PROPOSED AWS</tspan></text><polyline points="385,290 450,290" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="770,290 835,290" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1155,290 1220,290" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1380,370 1380,560" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="855,645 690,645" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="425,560 425,460 610,460 610,370" fill="none" stroke="#8990a4" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="450" y="425" width="228" height="25" rx="4" fill="#faf9fc"/><text x="455" y="443" fill="#72798d" font-size="17" font-weight="400"><tspan x="455" dy="0">Feedback into evaluation</tspan></text><g data-node="source" data-x="65" data-y="215" data-w="320" data-h="155"><rect x="65" y="215" width="320" height="155" rx="13" fill="#f3f3f6" stroke="#616777" stroke-opacity=".24"/><rect x="65" y="232" width="4" height="121" rx="2" fill="#616777"/><text x="83" y="250" fill="#616777" font-size="20" font-weight="600"><tspan x="83" dy="0">Version and review</tspan></text><text x="83" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="83" dy="0">Code, prompts, schema and rubric</tspan><tspan x="83" dy="22.950000000000003">Buying rule, models and source policy</tspan><tspan x="83" dy="22.950000000000003">Pinned dependencies and IaC</tspan><tspan x="83" dy="22.950000000000003">Peer review of changed assumptions</tspan></text></g><g data-node="checks" data-x="450" data-y="215" data-w="320" data-h="155"><rect x="450" y="215" width="320" height="155" rx="13" fill="#f0ebfb" stroke="#7256b0" stroke-opacity=".24"/><rect x="450" y="232" width="4" height="121" rx="2" fill="#7256b0"/><text x="468" y="250" fill="#7256b0" font-size="20" font-weight="600"><tspan x="468" dy="0">Build and evaluate</tspan></text><text x="468" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="468" dy="0">Contract and recovery tests</tspan><tspan x="468" dy="22.950000000000003">Expert-labeled fit and buyer evals</tspan><tspan x="468" dy="22.950000000000003">Unsupported-claim regression gate</tspan><tspan x="468" dy="22.950000000000003">Build and scan container image</tspan></text></g><g data-node="staging" data-x="835" data-y="215" data-w="320" data-h="155"><rect x="835" y="215" width="320" height="155" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="835" y="232" width="4" height="121" rx="2" fill="#426eb0"/><text x="853" y="250" fill="#426eb0" font-size="20" font-weight="600"><tspan x="853" dy="0">Exercise staging</tspan></text><text x="853" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="853" dy="0">ECR image -&gt; ECS staging</tspan><tspan x="853" dy="22.950000000000003">Isolated secrets and database</tspan><tspan x="853" dy="22.950000000000003">SAP sandbox and fault injection</tspan><tspan x="853" dy="22.950000000000003">German / English evidence cases</tspan></text></g><g data-node="release" data-x="1220" data-y="215" data-w="320" data-h="155"><rect x="1220" y="215" width="320" height="155" rx="13" fill="#e6f3ee" stroke="#327b67" stroke-opacity=".24"/><rect x="1220" y="232" width="4" height="121" rx="2" fill="#327b67"/><text x="1238" y="250" fill="#327b67" font-size="20" font-weight="600"><tspan x="1238" dy="0">Promote the same artifact</tspan></text><text x="1238" y="279" fill="#525b6e" font-size="17" font-weight="400"><tspan x="1238" dy="0">Approval against release criteria</tspan><tspan x="1238" dy="22.950000000000003">Compatible database migrations</tspan><tspan x="1238" dy="22.950000000000003">Gradual rollout and rollback</tspan><tspan x="1238" dy="22.950000000000003">Preserve historical assessments</tspan></text></g><g data-node="observe" data-x="160" data-y="560" data-w="530" data-h="170"><rect x="160" y="560" width="530" height="170" rx="13" fill="#e8effc" stroke="#426eb0" stroke-opacity=".24"/><rect x="160" y="577" width="4" height="136" rx="2" fill="#426eb0"/><text x="178" y="595" fill="#426eb0" font-size="20" font-weight="600"><tspan x="178" dy="0">Observe actual business outcomes</tspan></text><text x="178" y="624" fill="#525b6e" font-size="17" font-weight="400"><tspan x="178" dy="0">Trace run, job, evidence, model and reviewer IDs</tspan><tspan x="178" dy="22.950000000000003">Queue age, attempts, tokens, latency and errors</tspan><tspan x="178" dy="22.950000000000003">Sales acceptance and correction feedback</tspan><tspan x="178" dy="22.950000000000003">Unsupported buyer claims and unresolved evidence</tspan></text></g><g data-node="recover" data-x="855" data-y="560" data-w="585" data-h="170"><rect x="855" y="560" width="585" height="170" rx="13" fill="#fff3dc" stroke="#966419" stroke-opacity=".24"/><rect x="855" y="577" width="4" height="136" rx="2" fill="#966419"/><text x="873" y="595" fill="#966419" font-size="20" font-weight="600"><tspan x="873" dy="0">Practice recovery and assign owners</tspan></text><text x="873" y="624" fill="#525b6e" font-size="17" font-weight="400"><tspan x="873" dy="0">Restore database and evidence; verify RPO / RTO</tspan><tspan x="873" dy="22.950000000000003">Retry duplicate jobs and ambiguous CRM writes</tspan><tspan x="873" dy="22.950000000000003">Exercise lost responses and conservative budgets</tspan><tspan x="873" dy="22.950000000000003">Model outage, poor prompt, quota and key rotation</tspan></text></g><text x="55" y="829" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Suggested rollout: read-only pilot, reviewed opportunities, SAP sandbox, then approved production delivery.</tspan></text><text x="55" y="858" fill="#687084" font-size="18" font-weight="400"><tspan x="55" dy="0">Quality thresholds, retention, spend, latency and restore targets must be agreed with the teams that operate the service.</tspan></text><text x="55" y="886" fill="#9991a6" font-size="12" font-weight="400"><tspan x="55" dy="0">TECHNOVA CASE STUDY / FICTIONAL SOFTWARE PRODUCTS / IMPLEMENTED AND PROPOSED DESIGNS ARE LABELED</tspan></text></g></svg>