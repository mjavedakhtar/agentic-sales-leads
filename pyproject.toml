[project]
name = "lead-gen-platform"
version = "0.1.0"
description = "Open-Source AI Lead Generation Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pypdf==6.18.1",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
